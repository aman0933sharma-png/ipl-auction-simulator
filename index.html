<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPL Auction Simulator 2026</title>
<style>
  :root {
    --bg: #050a14;
    --card: #0f172a;
    --accent: #ff4d00;
    --gold: #ffd700;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --danger: #ef4444;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); }
  header { background: linear-gradient(135deg, #0c1445, #1e3a8a); padding: 1.2rem; text-align: center; border-bottom: 4px solid var(--accent); }
  header h1 { margin: 0; }
  .container { max-width: 1100px; margin: 0 auto; padding: 1.5rem; }
  .section { background: var(--card); border-radius: 16px; padding: 1.5rem; margin-bottom: 1.5rem; }
  h2 { color: var(--gold); margin-top: 0; }
  input, button { padding: 0.75rem 1rem; border-radius: 10px; border: none; font-size: 1rem; }
  input { background: #0c1222; color: white; border: 1px solid #334155; width: 100%; max-width: 260px; margin: 0.3rem; }
  button { background: var(--accent); color: white; cursor: pointer; font-weight: 600; }
  button:disabled { background: #475569; cursor: not-allowed; }
  button.secondary { background: #334155; }
  .owner-card { background: #1e293b; border-radius: 12px; padding: 1rem; margin: 0.5rem 0; border-left: 4px solid var(--accent); }
  .current-player { text-align: center; background: #1e3a5f; padding: 2rem; border-radius: 16px; margin: 1rem 0; }
  .timer { font-size: 2.6rem; font-weight: bold; color: var(--gold); }
  .timer.warning { color: var(--danger); }
  .bid-area { display: flex; flex-wrap: wrap; gap: 0.6rem; justify-content: center; margin: 1rem 0; }
  .teams-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1rem; }
  .purse { color: var(--gold); font-weight: 700; }
  .hidden { display: none !important; }
  .role-badge { background: #334155; padding: 0.15rem 0.5rem; border-radius: 999px; font-size: 0.75rem; }
</style>
</head>
<body>
<header>
  <h1>🏏 IPL Auction Simulator 2026</h1>
  <p>Real Players • ₹120 Cr • Max 25 Players • 1 Min Join Timer</p>
</header>

<div class="container">
  <div id="lobby" class="section">
    <h2>Join as Owner</h2>
    <p style="color:var(--muted)">1 minute mein join karo. Sirf jo join karenge wahi khelenge (min 2).</p>
    <div style="text-align:center; margin:1rem 0;">
      <div class="timer" id="lobbyTimer">01:00</div>
      <div style="color:var(--muted)">Join window closes in</div>
    </div>
    <div id="joinForm" style="text-align:center;">
      <input type="text" id="ownerName" placeholder="Owner Name">
      <input type="text" id="teamName" placeholder="Team Name">
      <br>
      <button onclick="addOwner()">Join Auction</button>
    </div>
    <div id="ownersList"></div>
    <div style="text-align:center; margin-top:1rem;">
      <button id="startBtn" onclick="startAuction()" disabled>Start Auction</button>
      <p id="status" style="color:var(--muted)"></p>
    </div>
  </div>

  <div id="auction" class="section hidden">
    <h2>Live Auction</h2>
    <div class="current-player">
      <div style="color:var(--muted)">NOW BIDDING</div>
      <h2 id="playerName" style="margin:0.5rem 0; font-size:2rem;">-</h2>
      <div id="playerInfo"></div>
      <div class="timer" id="bidTimer">15</div>
      <div style="font-size:1.5rem; margin:0.5rem 0;">Current Bid: <span id="currentBid" class="purse">-</span></div>
      <div id="highestBidder"></div>
    </div>
    <div class="bid-area" id="bidButtons"></div>
    <div style="text-align:center;">
      <button onclick="sellPlayer()">Sell</button>
      <button class="secondary" onclick="unsold()">Unsold</button>
    </div>
    <h3 style="margin-top:2rem;">Teams</h3>
    <div id="teamsGrid" class="teams-grid"></div>
  </div>
</div>

<script>
const PLAYERS = [
  {name:"Cameron Green",country:"Australia",role:"Allrounder",base:2},
  {name:"Matheesha Pathirana",country:"Sri Lanka",role:"Bowler",base:2},
  {name:"Liam Livingstone",country:"England",role:"Allrounder",base:2},
  {name:"Venkatesh Iyer",country:"India",role:"Allrounder",base:2},
  {name:"Ravi Bishnoi",country:"India",role:"Bowler",base:2},
  {name:"Wanindu Hasaranga",country:"Sri Lanka",role:"Allrounder",base:2},
  {name:"Devon Conway",country:"New Zealand",role:"Batter",base:2},
  {name:"Jake Fraser-McGurk",country:"Australia",role:"Batter",base:2},
  {name:"David Miller",country:"South Africa",role:"Batter",base:2},
  {name:"Steve Smith",country:"Australia",role:"Batter",base:2},
  {name:"Jamie Smith",country:"England",role:"Wicketkeeper",base:2},
  {name:"Ben Duckett",country:"England",role:"Batter",base:2},
  {name:"Anrich Nortje",country:"South Africa",role:"Bowler",base:2},
  {name:"Gus Atkinson",country:"England",role:"Bowler",base:2},
  {name:"Jason Holder",country:"West Indies",role:"Allrounder",base:2},
  {name:"Akeal Hosein",country:"West Indies",role:"Bowler",base:2},
  {name:"Maheesh Theekshana",country:"Sri Lanka",role:"Bowler",base:2},
  {name:"Rachin Ravindra",country:"New Zealand",role:"Allrounder",base:2},
  {name:"Finn Allen",country:"New Zealand",role:"Batter",base:2},
  {name:"Quinton de Kock",country:"South Africa",role:"Wicketkeeper",base:1},
  {name:"Jonny Bairstow",country:"England",role:"Wicketkeeper",base:1},
  {name:"Akash Deep",country:"India",role:"Bowler",base:1},
  {name:"Rahul Chahar",country:"India",role:"Bowler",base:1},
  {name:"Prithvi Shaw",country:"India",role:"Batter",base:0.75},
  {name:"Sarfaraz Khan",country:"India",role:"Batter",base:0.75},
  {name:"Rahul Tripathi",country:"India",role:"Batter",base:0.75},
  {name:"Pathum Nissanka",country:"Sri Lanka",role:"Batter",base:0.75},
  {name:"Kartik Sharma",country:"India",role:"Wicketkeeper",base:0.3},
  {name:"Prashant Veer",country:"India",role:"Allrounder",base:0.3},
  {name:"Auqib Dar",country:"India",role:"Allrounder",base:0.3},
  {name:"Mustafizur Rahman",country:"Bangladesh",role:"Bowler",base:2},
  {name:"Josh Inglis",country:"Australia",role:"Wicketkeeper",base:2},
  {name:"Kyle Jamieson",country:"New Zealand",role:"Bowler",base:2},
  {name:"Lungi Ngidi",country:"South Africa",role:"Bowler",base:2},
  {name:"Tom Banton",country:"England",role:"Wicketkeeper",base:2},
  {name:"Tim Seifert",country:"New Zealand",role:"Wicketkeeper",base:1.5},
  {name:"Matt Henry",country:"New Zealand",role:"Bowler",base:1.5},
  {name:"Deepak Hooda",country:"India",role:"Allrounder",base:0.75},
  {name:"Shivam Mavi",country:"India",role:"Bowler",base:0.75},
  {name:"Mayank Agarwal",country:"India",role:"Batter",base:0.75}
];

let owners = [];
let currentIndex = 0;
let currentBid = 0;
let highestBidder = null;
let bidTimer = null;
let timeLeft = 15;
let lobbyTime = 60;
let lobbyTimer = null;
let joiningClosed = false;

function startLobby() {
  lobbyTimer = setInterval(() => {
    lobbyTime--;
    const m = String(Math.floor(lobbyTime/60)).padStart(2,'0');
    const s = String(lobbyTime%60).padStart(2,'0');
    document.getElementById('lobbyTimer').textContent = m+':'+s;
    if (lobbyTime <= 10) document.getElementById('lobbyTimer').classList.add('warning');
    if (lobbyTime <= 0) closeJoining();
  }, 1000);
}

function closeJoining() {
  clearInterval(lobbyTimer);
  joiningClosed = true;
  document.getElementById('joinForm').style.display = 'none';
  document.getElementById('lobbyTimer').textContent = '00:00';
  document.getElementById('status').textContent = owners.length + ' owners locked in';
  if (owners.length >= 2) {
    document.getElementById('startBtn').disabled = false;
    setTimeout(startAuction, 2000);
  } else {
    document.getElementById('status').textContent = 'Need at least 2 players. Refresh to try again.';
  }
}

function addOwner() {
  if (joiningClosed) return alert('Joining closed!');
  const name = document.getElementById('ownerName').value.trim();
  const team = document.getElementById('teamName').value.trim();
  if (!name || !team) return alert('Name and Team both required');
  if (owners.length >= 10) return alert('Max 10 owners');
  owners.push({name, team, purse:120, squad:[]});
  document.getElementById('ownerName').value = '';
  document.getElementById('teamName').value = '';
  renderOwners();
  if (owners.length >= 2) document.getElementById('startBtn').disabled = false;
  document.getElementById('status').textContent = owners.length + ' owners joined';
}

function renderOwners() {
  document.getElementById('ownersList').innerHTML = owners.map((o,i) => 
    `<div class="owner-card"><strong>${o.name}</strong> — ${o.team}</div>`
  ).join('');
}

function startAuction() {
  if (owners.length < 2) return;
  clearInterval(lobbyTimer);
  document.getElementById('lobby').classList.add('hidden');
  document.getElementById('auction').classList.remove('hidden');
  showPlayer();
  renderTeams();
}

function showPlayer() {
  clearInterval(bidTimer);
  if (currentIndex >= PLAYERS.length) {
    document.querySelector('.current-player').innerHTML = '<h2>Auction Complete!</h2>';
    document.getElementById('bidButtons').innerHTML = '';
    return;
  }
  const p = PLAYERS[currentIndex];
  currentBid = p.base;
  highestBidder = null;
  timeLeft = 15;
  document.getElementById('playerName').textContent = p.name;
  document.getElementById('playerInfo').innerHTML = `${p.country} <span class="role-badge">${p.role}</span><br>Base: ₹${p.base} Cr`;
  updateBid();
  startBidTimer();
  renderBidButtons();
}

function startBidTimer() {
  const el = document.getElementById('bidTimer');
  el.textContent = timeLeft;
  el.classList.remove('warning');
  bidTimer = setInterval(() => {
    timeLeft--;
    el.textContent = timeLeft;
    if (timeLeft <= 5) el.classList.add('warning');
    if (timeLeft <= 0) {
      clearInterval(bidTimer);
      if (highestBidder !== null) sellPlayer();
      else unsold();
    }
  }, 1000);
}

function updateBid() {
  document.getElementById('currentBid').textContent = '₹' + currentBid.toFixed(2) + ' Cr';
  document.getElementById('highestBidder').innerHTML = highestBidder !== null 
    ? 'Leading: <strong>' + owners[highestBidder].team + '</strong>' 
    : 'No bids yet';
}

function renderBidButtons() {
  document.getElementById('bidButtons').innerHTML = owners.map((o,i) => {
    const full = o.squad.length >= 25;
    return `<button onclick="placeBid(${i})" ${full?'disabled':''}>${o.team}<br><small>₹${o.purse.toFixed(1)} Cr • ${o.squad.length}/25</small></button>`;
  }).join('');
}

function placeBid(i) {
  const o = owners[i];
  if (o.squad.length >= 25) return alert('Squad full (25 players)');
  const next = +(currentBid + 0.25).toFixed(2);
  if (o.purse < next) return alert('Not enough purse');
  const p = PLAYERS[currentIndex];
  if (p.country !== 'India' && o.squad.filter(x=>x.country!=='India').length >= 8) 
    return alert('Max 8 overseas players');
  currentBid = next;
  highestBidder = i;
  timeLeft = Math.max(timeLeft, 8);
  updateBid();
}

function sellPlayer() {
  clearInterval(bidTimer);
  if (highestBidder === null) return unsold();
  const w = owners[highestBidder];
  const p = PLAYERS[currentIndex];
  w.purse = +(w.purse - currentBid).toFixed(2);
  w.squad.push({...p, soldFor: currentBid});
  currentIndex++;
  showPlayer();
  renderTeams();
}

function unsold() {
  clearInterval(bidTimer);
  currentIndex++;
  showPlayer();
  renderTeams();
}

function renderTeams() {
  document.getElementById('teamsGrid').innerHTML = owners.map(o => `
    <div class="owner-card" style="${o.squad.length>=25?'border-left-color:#ef4444':''}">
      <strong>${o.team}</strong> (${o.name})<br>
      <div class="purse">₹${o.purse.toFixed(2)} Cr left</div>
      <div>Squad ${o.squad.length}/25${o.squad.length>=25?' FULL':''}</div>
      ${o.squad.map(p=>`<div style="font-size:0.85rem">• ${p.name} — ₹${p.soldFor}</div>`).join('')||'<div>Empty</div>'}
    </div>
  `).join('');
}

window.onload = startLobby;
</script>
</body>
</html>
