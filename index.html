<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPL Auction Multiplayer</title>
<style>
  :root { --bg:#050a14; --card:#0f172a; --accent:#ff4d00; --gold:#ffd700; --text:#f1f5f9; --muted:#94a3b8; --danger:#ef4444; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--text); }
  header { background:linear-gradient(135deg,#0c1445,#1e3a8a); padding:1.2rem; text-align:center; border-bottom:4px solid var(--accent); }
  .container { max-width:1100px; margin:0 auto; padding:1.5rem; }
  .section { background:var(--card); border-radius:16px; padding:1.5rem; margin-bottom:1.5rem; }
  h2 { color:var(--gold); margin-top:0; }
  input,button { padding:0.75rem 1rem; border-radius:10px; border:none; font-size:1rem; }
  input { background:#0c1222; color:white; border:1px solid #334155; width:100%; max-width:280px; margin:0.3rem; }
  button { background:var(--accent); color:white; cursor:pointer; font-weight:600; }
  button:disabled { background:#475569; cursor:not-allowed; }
  button.secondary { background:#334155; }
  .owner-card { background:#1e293b; border-radius:12px; padding:1rem; margin:0.5rem 0; border-left:4px solid var(--accent); }
  .current-player { text-align:center; background:#1e3a5f; padding:2rem; border-radius:16px; margin:1rem 0; }
  .timer { font-size:2.4rem; font-weight:bold; color:var(--gold); }
  .bid-area { display:flex; flex-wrap:wrap; gap:0.6rem; justify-content:center; margin:1rem 0; }
  .teams-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:1rem; }
  .purse { color:var(--gold); font-weight:700; }
  .hidden { display:none !important; }
  .role-badge { background:#334155; padding:0.15rem 0.5rem; border-radius:999px; font-size:0.75rem; }
  .room-box { text-align:center; background:#1e293b; padding:1.5rem; border-radius:12px; margin:1rem 0; }
</style>
</head>
<body>
<header>
  <h1>🏏 IPL Auction Multiplayer</h1>
  <p>Alag devices se khelo • Room Code • Real Players • ₹120 Cr</p>
</header>

<div class="container">
  <!-- CONNECT -->
  <div id="connect" class="section">
    <h2>Multiplayer Room</h2>
    <div class="room-box">
      <div id="myIdDisplay" style="font-size:1.4rem; color:var(--gold); margin:0.5rem 0;">Connecting...</div>
      <p style="color:var(--muted)">Room Code upar dikhega. Isse dusre log join karenge.</p>
    </div>
    <div style="text-align:center;">
      <input type="text" id="joinRoomInput" placeholder="Dusre ka Room Code daalo">
      <button onclick="joinRoom()">Join Room</button>
    </div>
    <div id="connectedPlayers" style="margin-top:1rem;"></div>
    <div style="text-align:center; margin-top:1.5rem;">
      <button id="startGameBtn" onclick="startGame()" disabled>Start Auction (Host only)</button>
    </div>
  </div>

  <!-- AUCTION -->
  <div id="auction" class="section hidden">
    <h2>Live Auction</h2>
    <div class="current-player">
      <div style="color:var(--muted)">NOW BIDDING</div>
      <h2 id="playerName" style="margin:0.5rem 0;font-size:2rem;">-</h2>
      <div id="playerInfo"></div>
      <div class="timer" id="bidTimer">15</div>
      <div style="font-size:1.5rem;margin:0.5rem 0;">Current Bid: <span id="currentBid" class="purse">-</span></div>
      <div id="highestBidder"></div>
      <div id="commentary" style="margin-top:1rem; font-size:1.1rem; color:#fbbf24; min-height:2.5rem;"></div>
    </div>
    <div class="bid-area" id="bidButtons"></div>
    <div style="text-align:center;">
      <button onclick="localSell()">Sell</button>
      <button class="secondary" onclick="localUnsold()">Unsold</button>
    </div>
    <h3 style="margin-top:2rem;">Teams</h3>
    <div id="teamsGrid" class="teams-grid"></div>
  </div>
</div>

<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script>
const PLAYERS = [
  {name:"Cameron Green",country:"Australia",role:"Allrounder",base:2},
  {name:"Matheesha Pathirana",country:"Sri Lanka",role:"Bowler",base:2},
  {name:"Liam Livingstone",country:"England",role:"Allrounder",base:2},
  {name:"Venkatesh Iyer",country:"India",role:"Allrounder",base:2},
  {name:"Ravi Bishnoi",country:"India",role:"Bowler",base:2},
  {name:"Wanindu Hasaranga",country:"Sri Lanka",role:"Allrounder",base:2},
  {name:"Devon Conway",country:"New Zealand",role:"Batter",base:2},
  {name:"Jake Fraser-McGurk",country:"Australia",role:"Batter",base:2},
  {name:"David Miller",country:"South Africa",role:"Batter",base:2},
  {name:"Steve Smith",country:"Australia",role:"Batter",base:2},
  {name:"Prithvi Shaw",country:"India",role:"Batter",base:0.75},
  {name:"Sarfaraz Khan",country:"India",role:"Batter",base:0.75},
  {name:"Kartik Sharma",country:"India",role:"Wicketkeeper",base:0.3},
  {name:"Prashant Veer",country:"India",role:"Allrounder",base:0.3},
  {name:"Mustafizur Rahman",country:"Bangladesh",role:"Bowler",base:2}
];

let peer, myId, connections = [], isHost = false;
let owners = [];
let currentIndex = 0, currentBid = 0, highestBidder = null, timeLeft = 15, bidTimer = null;

peer = new Peer();
peer.on('open', id => {
  myId = id;
  document.getElementById('myIdDisplay').textContent = 'Your Room Code: ' + id;
  isHost = true;
});

peer.on('connection', conn => {
  connections.push(conn);
  setupConn(conn);
  broadcast({type:'players', owners});
});

function setupConn(conn) {
  conn.on('data', data => handleData(data, conn));
  conn.on('close', () => {
    connections = connections.filter(c => c !== conn);
    updatePlayersList();
  });
}

function joinRoom() {
  const remoteId = document.getElementById('joinRoomInput').value.trim();
  if (!remoteId) return alert('Room code daalo');
  const conn = peer.connect(remoteId);
  connections.push(conn);
  setupConn(conn);
  isHost = false;
  document.getElementById('startGameBtn').disabled = true;
  document.getElementById('myIdDisplay').textContent = 'Joined room: ' + remoteId;
}

function broadcast(msg) {
  connections.forEach(c => { if (c.open) c.send(msg); });
}

function handleData(data) {
  if (data.type === 'players') {
    owners = data.owners || [];
    updatePlayersList();
    if (owners.length >= 2 && isHost) document.getElementById('startGameBtn').disabled = false;
  }
  if (data.type === 'start') {
    startAuctionUI();
  }
  if (data.type === 'state') {
    currentIndex = data.currentIndex;
    currentBid = data.currentBid;
    highestBidder = data.highestBidder;
    owners = data.owners;
    updateUI();
  }
  if (data.type === 'join') {
    owners.push(data.player);
    broadcast({type:'players', owners});
    updatePlayersList();
  }
}

function updatePlayersList() {
  document.getElementById('connectedPlayers').innerHTML = owners.map(o => 
    `<div class="owner-card">${o.name} — ${o.team}</div>`
  ).join('') || '<p style="color:var(--muted)">No players yet</p>';
}

function startGame() {
  if (!isHost) return;
  if (owners.length === 0) {
    const name = prompt('Your name?') || 'Host';
    const team = prompt('Your team name?') || 'Host Team';
    owners.push({name, team, purse:120, squad:[]});
  }
  broadcast({type:'start'});
  startAuctionUI();
}

function startAuctionUI() {
  document.getElementById('connect').classList.add('hidden');
  document.getElementById('auction').classList.remove('hidden');
  showPlayer();
  renderTeams();
}

function setCommentary(text) {
  document.getElementById('commentary').textContent = text;
}

function showPlayer() {
  clearInterval(bidTimer);
  if (currentIndex >= PLAYERS.length) {
    document.querySelector('.current-player').innerHTML = '<h2>Auction Complete!</h2>';
    setCommentary('Auction khatam! Saari teams ready hain.');
    return;
  }
  const p = PLAYERS[currentIndex];
  currentBid = p.base;
  highestBidder = null;
  timeLeft = 15;
  document.getElementById('playerName').textContent = p.name;
  document.getElementById('playerInfo').innerHTML = `${p.country} <span class="role-badge">${p.role}</span><br>Base: ₹${p.base} Cr`;
  updateBidDisplay();
  startBidTimer();
  renderBidButtons();
  setCommentary(`${p.name} aaya hai auction mein! Base price ₹${p.base} crore se shuru.`);
  if (isHost) broadcastState();
}

function startBidTimer() {
  const el = document.getElementById('bidTimer');
  el.textContent = timeLeft;
  bidTimer = setInterval(() => {
    timeLeft--;
    el.textContent = timeLeft;
    if (timeLeft <= 0) {
      clearInterval(bidTimer);
      if (highestBidder !== null) sellPlayer();
      else unsold();
    }
  }, 1000);
}

function updateBidDisplay() {
  document.getElementById('currentBid').textContent = '₹' + currentBid.toFixed(2) + ' Cr';
  document.getElementById('highestBidder').innerHTML = highestBidder !== null 
    ? 'Leading: <strong>' + (owners[highestBidder]?.team || '') + '</strong>' : 'No bids yet';
}

function renderBidButtons() {
  document.getElementById('bidButtons').innerHTML = owners.map((o,i) => 
    `<button onclick="placeBid(${i})">${o.team}<br><small>₹${o.purse.toFixed(1)} Cr • ${o.squad.length}/25</small></button>`
  ).join('');
}

function placeBid(i) {
  if (owners[i].squad.length >= 25) return alert('Squad full');
  const next = +(currentBid + 0.25).toFixed(2);
  if (owners[i].purse < next) return alert('Not enough purse');
  currentBid = next;
  highestBidder = i;
  timeLeft = Math.max(timeLeft, 8);
  updateBidDisplay();
  setCommentary(`${owners[i].team} ne bid lagayi ₹${currentBid.toFixed(2)} crore!`);
  if (isHost) broadcastState();
}

function sellPlayer() {
  clearInterval(bidTimer);
  if (highestBidder === null) return unsold();
  const w = owners[highestBidder];
  const p = PLAYERS[currentIndex];
  w.purse = +(w.purse - currentBid).toFixed(2);
  w.squad.push({...p, soldFor: currentBid});
  setCommentary(`Sold! ${p.name} gaya ${w.team} ke paas ₹${currentBid.toFixed(2)} crore mein!`);
  currentIndex++;
  showPlayer();
  renderTeams();
  if (isHost) broadcastState();
}

function unsold() {
  clearInterval(bidTimer);
  const p = PLAYERS[currentIndex];
  setCommentary(`${p ? p.name : 'Player'} unsold raha!`);
  currentIndex++;
  showPlayer();
  renderTeams();
  if (isHost) broadcastState();
}

function localSell() { if (isHost) sellPlayer(); }
function localUnsold() { if (isHost) unsold(); }

function broadcastState() {
  broadcast({type:'state', currentIndex, currentBid, highestBidder, owners});
}

function renderTeams() {
  document.getElementById('teamsGrid').innerHTML = owners.map(o => `
    <div class="owner-card">
      <strong>${o.team}</strong> (${o.name})<br>
      <div class="purse">₹${o.purse.toFixed(2)} Cr</div>
      <div>Squad ${o.squad.length}/25</div>
      ${o.squad.map(p=>`<div style="font-size:0.85rem">• ${p.name} — ₹${p.soldFor}</div>`).join('')||'<div>Empty</div>'}
    </div>
  `).join('');
}

function updateUI() {
  updateBidDisplay();
  renderBidButtons();
  renderTeams();
}
</script>
</body>
</html>
